<body>
<div class="wrap" id="app"></div>

<button class="fab" id="fab" hidden><span style="font-size:20px;line-height:1">+</span>Add purchase</button>

<div class="scrim" id="pScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="sheet-h"><h3 id="pTitle">Add purchase</h3><button class="close" data-close aria-label="Close">✕</button></div>
    <label class="field"><span class="label">Item</span><input class="input" id="pItem" placeholder="Fish & vegetables" maxlength="60"></label>
    <label class="field"><span class="label">Amount</span><div class="amtwrap"><b id="curSym">₹</b><input class="input" id="pAmt" inputmode="decimal" placeholder="0.00"></div></label>
    <div class="field"><span class="label">Paid by</span><div class="join"><div class="chips" id="pPayer"></div></div></div>
    <label class="field"><span class="label">Date</span><input class="input" type="date" id="pDate"></label>
    <div class="err" id="pErr"></div>
    <div class="actions">
      <button class="btn danger" id="pDelete" hidden>Delete</button>
      <button class="btn primary" id="pSave" style="border-radius:14px">Save purchase</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
/* ============ small helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const mk=(y,m)=>y+"-"+pad(m+1);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const initials=n=>(n||"M").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase();
const MON=["Jan","Feb","Mar","Apr","May","June","July","Aug","Sept","Oct","Nov","Dec"];
const PALETTE=["#52E5CB","#A78BFA","#F5B942","#F472B6","#60A5FA","#FB923C","#34D399","#E879F9"];
const colorAt=i=>PALETTE[((i%PALETTE.length)+PALETTE.length)%PALETTE.length];
const CURRENCIES=[["SAR","Saudi riyal"],["INR","Indian rupee"],["AED","UAE dirham"],["QAR","Qatari riyal"],["OMR","Omani rial"],["KWD","Kuwaiti dinar"],["BHD","Bahraini dinar"],["USD","US dollar"]];
const r2=n=>Math.round((+n||0)*100)/100;
const cur=()=>(S.mess&&S.mess.currency)||"SAR";
const curSymbol=c=>{try{return new Intl.NumberFormat("en-IN",{style:"currency",currency:c}).formatToParts(0).find(p=>p.type==="currency").value}catch(e){return c}};
const numStr=n=>{n=r2(n);const whole=Math.abs(n-Math.round(n))<1e-9;return n.toLocaleString("en-IN",{minimumFractionDigits:whole?0:2,maximumFractionDigits:2})};
const fmt=n=>curSymbol(cur())+" "+numStr(n);
const fmtSigned=n=>{const sy=curSymbol(cur());return (r2(n)>0?"+":r2(n)<0?"−":"")+sy+(sy.length>1?" ":"")+numStr(Math.abs(n))};
const fmtPlain=n=>cur()+" "+r2(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
function parseAmount(v){v=String(v).trim().replace(/\s/g,"");if(v.includes(",")&&!v.includes("."))v=v.replace(",",".");else v=v.replace(/,/g,"");const n=Number(v);return isFinite(n)?r2(n):NaN}
function genCode(){const a="abcdefghjkmnpqrstuvwxyz23456789";let s="";const b=new Uint32Array(8);crypto.getRandomValues(b);b.forEach(x=>s+=a[x%a.length]);return s}
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2800)}
function failMsg(e){const c=e&&e.code;
  if(c==="permission-denied")return "You don't have permission to do that.";
  if(c==="unavailable")return "You're offline. Check your connection.";
  return "Something went wrong. Please try again.";}
function armConfirm(btn,label,action){
  if(btn.dataset.armed){action();return}
  btn.dataset.armed="1";const old=btn.innerHTML;btn.innerHTML=label;btn.classList.add("sure");
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.innerHTML=old;btn.classList.remove("sure")}},3000);
}

const toEmail=id=>{id=id.trim().toLowerCase();return id.includes("@")?id:id+"@"+USER_DOMAIN};
const loginIdOf=u=>{const e=(u&&u.email)||"";return e.endsWith("@"+USER_DOMAIN)?e.slice(0,-(USER_DOMAIN.length+1)):e};

/* ============ members (names used as "paid by") ============ */
function members(){
  const list=((S.mess&&S.mess.members)||[]).map(m=>({id:m.id,name:m.name,manual:true}));
  Object.entries(S.people).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0)).forEach(([uid,p])=>{
    const linked=p.memberId&&p.memberId!==uid?list.find(x=>x.id===p.memberId):null;
    if(linked){linked.uid=uid}else list.push({id:uid,name:p.name||"Member",uid});
  });
  return list.map((m,i)=>({...m,color:colorAt(i)}));
}
const member=id=>members().find(m=>m.id===id);

/* ============ calculations (in halalas/paise so decimals are exact) ============ */
function monthData(){
  const key=mk(S.view.y,S.view.m), ms=members();
  const list=S.purchases.filter(p=>p.date&&p.date.slice(0,7)===key);
  const C=v=>Math.round((+v||0)*100);
  const totalC=list.reduce((a,p)=>a+C(p.amount),0);
  const n=ms.length||1, shareC=totalC/n;
  const paidC={};ms.forEach(m=>paidC[m.id]=0);
  list.forEach(p=>{if(p.payer in paidC)paidC[p.payer]+=C(p.amount)});
  const bal=ms.map(m=>({m,paid:paidC[m.id]/100,balC:paidC[m.id]-shareC,bal:(paidC[m.id]-shareC)/100}));
  const cr=bal.filter(b=>b.balC>=0.5).map(b=>({m:b.m,v:b.balC})).sort((a,b)=>b.v-a.v);
  const dr=bal.filter(b=>b.balC<=-0.5).map(b=>({m:b.m,v:-b.balC})).sort((a,b)=>b.v-a.v);
  const tx=[];let i=0,j=0;
  while(i<dr.length&&j<cr.length){const x=Math.min(dr[i].v,cr[j].v);
    if(Math.round(x)>=1)tx.push({from:dr[i].m,to:cr[j].m,amt:Math.round(x)/100});
    dr[i].v-=x;cr[j].v-=x;if(dr[i].v<0.5)i++;if(cr[j].v<0.5)j++;}
  return{list,total:totalC/100,share:shareC/100,bal,tx};
}

/* ============ boot ============ */
auth.onAuthStateChanged(u=>{if(!registering)boot(u)});
async function boot(u){
  stopAll();S.user=u;
  if(!u){S.screen="login";render();return}
  S.screen="loading";render();
  try{await userRef(u.uid).set({name:u.displayName||pendingName||loginIdOf(u),avatarUrl:u.photoURL||"",updatedAt:Date.now()},{merge:true})}catch(e){}
  try{const d=await userRef(u.uid).get();S.profile=d.exists?d.data():{}}catch(e){S.profile={}}

  if(joinCode&&await loadInvite(joinCode)){
    const pd=await peopleCol(S.invite.messId).doc(u.uid).get().catch(()=>null);
    if(pd&&pd.exists){const id=S.invite.messId;clearJoin();return openMess(id)}
    S.screen="onboard";S.ob="choose";render();return;
  }
  if(S.profile.current&&await isMemberOf(S.profile.current))return openMess(S.profile.current);
  // fall back to any mess they belong to
  for(const id of (S.profile.messIds||[])){if(id!==S.profile.current&&await isMemberOf(id))return openMess(id)}
  S.screen="onboard";S.ob="choose";render();
}
async function isMemberOf(id){try{const d=await peopleCol(id).doc(S.user.uid).get();return d.exists}catch(e){return false}}
async function loadInvite(code){
  try{
    const inv=await fs.collection("invites").doc(code).get();
    if(!inv.exists){toast("This invite link has expired. Ask the mess head for a new one.");clearJoin();return false}
    const d=inv.data();const dir=await fs.collection("directory").doc(d.messId).get();
    S.invite={code,messId:d.messId,role:d.role||"editor",name:dir.exists?dir.data().name:"a mess",headName:dir.exists?dir.data().headName:""};
    return true;
  }catch(e){toast(failMsg(e));clearJoin();return false}
}
function stopAll(){unsub.forEach(f=>{try{f()}catch(e){}});unsub=[];
  [unsubMonth,unsubReq,unsubPending].forEach(f=>{if(f)try{f()}catch(e){}});unsubMonth=unsubReq=unsubPending=null}

/* ============ open a mess (live) ============ */
function openMess(id){
  stopAll();
  S.messId=id;S.mess=null;S.people={};S.requests=[];S.purchases=[];S.inSettings=false;S.screen="app";
  userRef(S.user.uid).set({current:id,messIds:FV.arrayUnion(id)},{merge:true}).catch(()=>{});
  S.profile.current=id;
  unsub.push(messRef(id).onSnapshot(s=>{
    if(!s.exists){leftMess("This mess no longer exists.");return}
    S.mess=s.data();refresh();
  },e=>{if(e.code==="permission-denied")leftMess("You're no longer a member of this mess.")}));
  unsub.push(peopleCol(id).onSnapshot(s=>{
    S.people={};s.docs.forEach(d=>S.people[d.id]=d.data());
    if(!S.people[S.user.uid]){leftMess(leaving?"You left the mess.":"You were removed from this mess.");leaving=false;return}
    refresh();
  },()=>{}));
  subscribeMonth();
  render();
}
function leftMess(msg){
  stopAll();toast(msg);
  const id=S.messId;S.messId=null;S.mess=null;S.people={};
  if(S.user)userRef(S.user.uid).set({current:FV.delete(),messIds:FV.arrayRemove(id)},{merge:true}).catch(()=>{});
  S.profile.current=null;S.screen="onboard";S.ob="choose";render();
}
function subscribeMonth(){
  if(unsubMonth){unsubMonth();unsubMonth=null}
  if(!S.messId)return;
  const {y,m}=S.view;const start=mk(y,m)+"-01";const end=mk(m===11?y+1:y,m===11?0:m+1)+"-01";
  unsubMonth=purCol(S.messId).where("date",">=",start).where("date","<",end).onSnapshot(s=>{
    S.purchases=s.docs.map(d=>({id:d.id,...d.data()}));refresh();
  },()=>{});
}
function refresh(){ if(S.screen!=="app")return; if(S.inSettings)drawSettingsLive(); else render(); }

/* ============ render ============ */
function render(){
  const app=$("#app");
  $("#fab").hidden=true;
  if(S.screen==="loading"){app.innerHTML=`<div class="center"><div class="card empty">Loading…</div></div>`;return}
  if(S.screen==="login"){if(authMsg)authTab="register";app.innerHTML=loginHTML();bindLogin();return}
  if(S.screen==="onboard"){app.innerHTML=onboardHTML();bindOnboard();return}
  if(S.inSettings){S.setKey=role()+"|"+!!S.mess;app.innerHTML=settingsHTML();bindSettings();drawSettingsLive();return}
  app.innerHTML=mainHTML();bindMain();
  $("#fab").hidden=!canAdd();
}

/* ---------- login ---------- */
let authTab="login";
function loginHTML(){
  const inv=joinCode?`<p style="color:var(--accent);margin:0 0 14px">You've been invited to join a mess. ${authTab==="login"?"Log in":"Create an account"} to continue.</p>`:"";
  const reg=authTab==="register";
  return `<div class="center"><div class="brand"><div class="logo">ML</div><div class="display" style="font-size:24px;font-weight:600">Mess Ledger</div></div>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${!reg}" data-auth="login">Log in</button><button role="tab" aria-selected="${reg}" data-auth="register">Register</button></div>
  <div class="card" style="padding:24px 20px">
    ${inv}
    ${reg?`<label class="field"><span class="label">Your name</span><input class="input" id="aName" maxlength="24" autocomplete="name" placeholder="e.g. Rishad"></label>`:""}
    <label class="field"><span class="label">Login ID</span><input class="input" id="aId" maxlength="60" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="${reg?"Choose a login ID (or your email)":"Login ID or email"}"></label>
    <label class="field"><span class="label">Password</span><div class="pw"><input class="input" id="aPw" type="password" autocomplete="${reg?"new-password":"current-password"}" placeholder="${reg?"At least 6 characters":"Password"}"><button type="button" class="pwtoggle" id="pwToggle">Show</button></div></label>
    ${reg?`<label class="field"><span class="label">Confirm password</span><input class="input" id="aPw2" type="password" autocomplete="new-password"></label>`:""}
    <div class="err" id="aErr"></div>
    <button class="btn primary" id="authGo" style="width:100%">${reg?"Create account":"Log in"}</button>
    ${reg?`<p class="zero" style="font-size:13px;margin:12px 0 0">Remember your login ID and password. If you register with an email, you can reset a forgotten password.</p>`:`<button class="linkbtn" id="forgotPw">Forgot password?</button>`}
  </div></div>`;
}
function authError(e){
  const c=e&&e.code;
  if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"].includes(c))return "Wrong login ID or password.";
  if(c==="auth/email-already-in-use")return "That login ID is already taken. Try another.";
  if(c==="auth/weak-password")return "Password must be at least 6 characters.";
  if(c==="auth/invalid-email")return "That login ID isn't valid. Use letters, numbers, dot or underscore.";
  if(c==="auth/too-many-requests")return "Too many tries. Wait a few minutes and try again.";
  if(c==="auth/operation-not-allowed")return "Email/Password sign-in is not enabled in Firebase yet.";
  if(c==="auth/network-request-failed")return "You're offline. Check your connection.";
  return "Something went wrong ("+(c||"error")+").";
}
function bindLogin(){
  document.querySelectorAll("[data-auth]").forEach(b=>b.onclick=()=>{authTab=b.dataset.auth;render()});
  $("#pwToggle").onclick=()=>{const i=$("#aPw"),show=i.type==="password";i.type=show?"text":"password";const j=$("#aPw2");if(j)j.type=i.type;$("#pwToggle").textContent=show?"Hide":"Show"};
  const go=$("#authGo"),err=$("#aErr");
  if(authMsg){err.textContent=authMsg;authMsg=""}
  document.querySelectorAll("#app input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")go.click()}));
  go.onclick=async()=>{
    err.textContent="";
    const id=$("#aId").value.trim(),pw=$("#aPw").value;
    if(!id){err.textContent="Enter your login ID.";return}
    if(!id.includes("@")&&!/^[a-zA-Z0-9._]{3,30}$/.test(id)){err.textContent="Login ID: 3 to 30 letters, numbers, dot or underscore. No spaces.";return}
    if(!pw){err.textContent="Enter your password.";return}
    const reg=authTab==="register";
    if(reg){
      const name=$("#aName").value.trim();
      if(!name){err.textContent="Enter your name.";return}
      if(pw.length<6){err.textContent="Password must be at least 6 characters.";return}
      if(pw!==$("#aPw2").value){err.textContent="The two passwords don't match.";return}
      if(name.length<2){err.textContent="Name is too short.";return}
      pendingName=name.replace(/\s+/g," ");
      try{const t=await fs.collection("names").doc(nameKey(name)).get();if(t.exists){err.textContent="Someone already registered with the name \""+name+"\". Add your surname or initial.";return}}catch(e){}
    }
    go.disabled=true;go.textContent=reg?"Creating account…":"Logging in…";
    try{
      if(reg){
        registering=true;
        const c=await auth.createUserWithEmailAndPassword(toEmail(id),pw);
        try{await fs.collection("names").doc(nameKey(pendingName)).set({uid:c.user.uid,name:pendingName,at:Date.now()})}
        catch(e){                                   // name was taken a moment ago: undo the account
          authMsg="Someone already registered with the name \""+pendingName+"\". Add your surname or initial.";
          try{await c.user.delete()}catch(x){}
          registering=false;await auth.signOut().catch(()=>{});boot(null);return;
        }
        await c.user.updateProfile({displayName:pendingName});
        await userRef(c.user.uid).set({name:pendingName,nameKey:nameKey(pendingName)},{merge:true}).catch(()=>{});
        registering=false;boot(auth.currentUser);
      }
      else await auth.signInWithEmailAndPassword(toEmail(id),pw);
    }catch(e){registering=false;go.disabled=false;go.textContent=reg?"Create account":"Log in";err.textContent=authError(e)}
  };
  const fp=$("#forgotPw");if(fp)fp.onclick=async()=>{
    const id=$("#aId").value.trim();
    if(!id.includes("@")){err.textContent="Password reset works only for accounts registered with an email. Type that email above, or ask your mess head to help you make a new account.";return}
    try{await auth.sendPasswordResetEmail(id);toast("Reset link sent to "+id)}catch(e){err.textContent=authError(e)}
  };
}

function bindOnboard(){
  document.querySelectorAll("[data-ob]").forEach(b=>b.onclick=()=>{S.ob=b.dataset.ob;render()});
  const so=$("#signOut");if(so)so.onclick=()=>auth.signOut();

  const ji=$("#joinInvite");if(ji)ji.onclick=joinViaInvite;
  const cm=$("#createMess");if(cm)cm.onclick=createMess;
}

async function joinViaInvite(){
  const btn=$("#joinInvite");const name=dispName()||"Member";
  const {messId,code,role}=S.invite;
  btn.disabled=true;btn.textContent="Joining…";
  try{
    await peopleCol(messId).doc(S.user.uid).set({name,role,memberId:S.user.uid,code,joinedAt:Date.now()});
    clearJoin();openMess(messId);toast("Welcome to the mess!");
  }catch(e){btn.disabled=false;btn.textContent="Join mess";toast(e.code==="permission-denied"?"This invite link is no longer valid. Ask the mess head for a new one.":failMsg(e))}
}
async function createMess(){
  const name=$("#hmName").value.trim(), you=dispName()||"Mess head", currency=$("#hmCur").value;
  if(!name){$("#hmErr").textContent="Give your mess a name.";return}
  const btn=$("#createMess");btn.disabled=true;btn.textContent="Creating…";
  const id=fs.collection("messes").doc().id, code=genCode(), uid=S.user.uid, now=Date.now();
  const b=fs.batch();
  b.set(messRef(id),{name,nameLower:name.toLowerCase(),logo:"",currency,headUid:uid,members:[],inviteCode:code,defaultRole:"editor",createdAt:now});
  b.set(peopleCol(id).doc(uid),{name:you,role:"head",memberId:uid,joinedAt:now});
  b.set(fs.collection("directory").doc(id),{name,nameLower:name.toLowerCase(),headName:you,headUid:uid,createdAt:now});
  b.set(fs.collection("invites").doc(code),{messId:id,role:"editor",createdBy:uid,createdAt:now});
  try{await b.commit();clearJoin();openMess(id);S.inSettings=true;render();toast("Mess created. Share your invite link with your members.")}
  catch(e){btn.disabled=false;btn.textContent="Create mess";$("#hmErr").textContent=failMsg(e)}
}

function logoHTML(logo,name){return logo?`<img src="${logo}" alt="Mess logo">`:esc(initials(name))}
function mainHTML(){
  const M=S.mess||{name:"…"};const ms=members();const D=monthData();const n=ms.length;
  const {y,m,tab}=S.view;
  const my=me()||{};
  let h=`<header class="top">
    <div class="logo">${logoHTML(M.logo,M.name)}</div>
    <div class="title"><h1>${esc(M.name)}</h1>
      <span class="badge${canAdd()?"":" view"}">${esc(my.name||"")} · ${ROLE_LABEL[role()]||""}</span></div>
    <button class="gear" id="openSettings" aria-label="Settings">⚙</button>
    <div class="monthpill"><button id="prevM" aria-label="Previous month">&lt;</button><div class="m">${new Date(y,m,1).toLocaleString("en-US",{month:"long"})} ${y}</div><button id="nextM" aria-label="Next month">&gt;</button></div>
  </header>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==="ledger"}" data-tab="ledger">Ledger</button><button role="tab" aria-selected="${tab==="report"}" data-tab="report">Month report</button></div>
  <main class="stack">`;
  h+=`<div class="card hero"><div class="label" style="margin:0">Total spent · ${MON[m]}</div><div class="big">${fmt(D.total)}</div>
    <div class="sub">${n?`Split across ${n} member${n>1?"s":""} · ${fmt(D.share)} each`:"No members yet"}</div></div>`;
  if(tab==="ledger"){
    if(n){const max=Math.max(1,...D.bal.map(b=>b.paid));
      h+=`<div class="card"><div class="label">Per-member paid</div>`+D.bal.map(b=>`<div class="pm"><div class="pm-h"><span class="n">${esc(b.m.name)} paid</span><span class="v">${fmt(b.paid)}</span></div><div class="track"><i style="width:${(b.paid/max*100).toFixed(1)}%;background:${b.m.color}"></i></div></div>`).join("")+`</div>`}
    if(!D.list.length)h+=`<div class="empty">No purchases this month</div>`;
    else{
      const sorted=[...D.list].sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
      let curD="",block="";
      sorted.forEach(p=>{
        if(p.date!==curD){curD=p.date;const dd=new Date(p.date+"T00:00");block+=`<div class="day">${dd.toLocaleDateString("en-GB",{weekday:"short"})}, ${dd.getDate()} ${MON[dd.getMonth()]}</div>`}
        const pm=member(p.payer);const ed=canEditP(p);
        const adder=p.addedBy&&S.people[p.addedBy]?"Added by "+S.people[p.addedBy].name:"";
        block+=`<div class="row"><i class="dot" style="background:${pm?pm.color:"#888"}"></i>
          <button class="it" ${ed?`data-edit="${p.id}"`:""} title="${esc(adder)}">${esc(p.item)}</button>
          <span class="who">${pm?esc(pm.name):"Removed"}</span><span class="amt">${fmt(p.amount)}</span>
          ${ed?`<button class="x" data-del="${p.id}" aria-label="Delete ${esc(p.item)}">×</button>`:""}</div>`;
      });
      h+=`<div>${block}</div>`;
    }
  }else{
    h+=`<button class="btn" id="dlPdf" style="width:100%">↓ Download PDF</button>`;
    h+=`<div class="card"><div class="label">Who owes whom</div>`+(D.tx.length?D.tx.map(t=>`<div class="owe"><div class="av" style="background:${t.from.color}">${esc((t.from.name[0]||"?").toUpperCase())}</div><div class="t">${esc(t.from.name)} pays <em>${esc(t.to.name)}</em></div><div class="v">${fmt(t.amt)}</div></div>`).join(""):`<div class="zero" style="padding:4px 0">${D.total?"Everyone is settled up.":"Nothing to settle yet."}</div>`)+`</div>`;
    if(n)h+=`<div class="card" style="padding-bottom:10px"><div class="label" style="margin-bottom:4px">Member balances · ${new Date(y,m,1).toLocaleString("en-US",{month:"long"})} ${y}</div>`+D.bal.map(b=>{
      const cls=b.balC>=0.5?"pos":b.balC<=-0.5?"neg":"zero";
      return `<div class="bal"><div class="av" style="background:${b.m.color}">${esc((b.m.name[0]||"?").toUpperCase())}</div><div class="n">${esc(b.m.name)}</div><div class="r">paid ${fmt(b.paid)}<span class="d ${cls}">${cls==="zero"?"settled":fmtSigned(b.bal)}</span></div></div>`}).join("")+`</div>`;
    h+=`<div class="card"><div class="label">Month summary</div><div class="sum"><div><strong>${D.list.length}</strong><span class="label" style="letter-spacing:.16em">Purchases</span></div><div><strong>${fmt(D.total)}</strong><span class="label" style="letter-spacing:.16em">Total</span></div><div><strong>${fmt(D.share)}</strong><span class="label" style="letter-spacing:.16em">Per head</span></div></div></div>`;
  }
  if(!canAdd())h+=`<div class="zero" style="text-align:center;font-size:13px">You can view this mess. Only the mess head and admins add purchases.</div>`;
  return h+`</main>`;
}
function bindMain(){
  $("#openSettings").onclick=()=>{S.inSettings=true;window.scrollTo(0,0);render()};
  $("#prevM").onclick=()=>shift(-1);$("#nextM").onclick=()=>shift(1);
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.view.tab=b.dataset.tab;render()});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openPurchase(b.dataset.edit));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>armConfirm(b,"Delete?",async()=>{try{await purCol(S.messId).doc(b.dataset.del).delete();toast("Purchase deleted")}catch(e){toast(failMsg(e))}}));

function shift(n){const v=S.view;v.m+=n;if(v.m<0){v.m=11;v.y--}if(v.m>11){v.m=0;v.y++}subscribeMonth();render()}

/* ---------- add / edit purchase ---------- */
let editing=null,payerSel=null,busy=false;
function openSheet(){$("#pScrim").classList.add("open")}
function closeSheets(){document.querySelectorAll(".scrim").forEach(s=>s.classList.remove("open"))}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheets);
document.querySelectorAll(".scrim").forEach(s=>s.addEventListener("click",e=>{if(e.target===s)closeSheets()}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheets()});
$("#fab").onclick=()=>openPurchase(null);
function openPurchase(id){
  const p=id?S.purchases.find(x=>x.id===id):null;
  if(p&&!canEditP(p))return; if(!p&&!canAdd())return;
  const ms=members();if(!ms.length)return;
  editing=p;
  $("#pTitle").textContent=p?"Edit purchase":"Add purchase";
  $("#pItem").value=p?p.item:"";$("#pAmt").value=p?p.amount:"";
  const mine=me()&&me().memberId;
  payerSel=p?p.payer:(payerSel&&member(payerSel)?payerSel:(mine&&member(mine)?mine:ms[0].id));
  const now=new Date();const inView=now.getFullYear()===S.view.y&&now.getMonth()===S.view.m;
  $("#pDate").value=p?p.date:(inView?today():mk(S.view.y,S.view.m)+"-01");
  const del=$("#pDelete");del.hidden=!p;delete del.dataset.armed;del.textContent="Delete";del.classList.remove("sure");
  $("#pErr").textContent="";$("#pSave").disabled=false;$("#pSave").textContent="Save purchase";
  const sym=curSymbol(cur());$("#curSym").textContent=sym;$("#pAmt").parentElement.style.setProperty("--symw",(sym.length*0.62+0.4)+"em");
  drawPayers();openSheet();setTimeout(()=>$("#pItem").focus(),60);
}
function drawPayers(){
  $("#pPayer").innerHTML=members().map(m=>`<button class="chip" aria-pressed="${m.id===payerSel}" data-m="${m.id}"><i class="dot" style="background:${m.color}"></i>${esc(m.name)}</button>`).join("");
  document.querySelectorAll("#pPayer .chip").forEach(c=>c.onclick=()=>{payerSel=c.dataset.m;drawPayers()});
}
$("#pSave").onclick=async()=>{
  if(busy)return;
  const item=$("#pItem").value.trim(), amount=parseAmount($("#pAmt").value), date=$("#pDate").value;
  if(!item){$("#pErr").textContent="Enter what you bought.";return}
  if(!(amount>0)){$("#pErr").textContent="Enter an amount above zero.";return}
  if(!date){$("#pErr").textContent="Pick a date.";return}
  if(!member(payerSel)){$("#pErr").textContent="Choose who paid.";return}
  busy=true;$("#pSave").disabled=true;$("#pSave").textContent="Saving…";
  try{
    if(editing)await purCol(S.messId).doc(editing.id).update({item,amount,payer:payerSel,date});
    else await purCol(S.messId).add({item,amount,payer:payerSel,date,created:Date.now(),addedBy:S.user.uid});
    const [y,m]=date.split("-").map(Number);
    if(y!==S.view.y||m-1!==S.view.m){S.view.y=y;S.view.m=m-1;subscribeMonth()}
    closeSheets();toast(editing?"Purchase updated":"Purchase saved");
  }catch(e){$("#pErr").textContent=failMsg(e)}
  busy=false;$("#pSave").disabled=false;$("#pSave").textContent="Save purchase";
};
$("#pDelete").onclick=e=>{if(!editing)return;armConfirm(e.currentTarget,"Tap again to delete",async()=>{try{await purCol(S.messId).doc(editing.id).delete();closeSheets();toast("Purchase deleted")}catch(er){toast(failMsg(er))}})};

async function removeMember(id){
  const m=members().find(x=>x.id===id);if(!m)return;
  try{
    const snap=await purCol(S.messId).where("payer","==",id).get();
    for(const d of snap.docs)await d.ref.delete();
    if(m.uid)await peopleCol(S.messId).doc(m.uid).delete();
    if(m.manual)await messRef(S.messId).update({members:(S.mess.members||[]).filter(x=>x.id!==id)});
    toast(m.name+" removed");
  }catch(e){toast(failMsg(e))}
}

  box.innerHTML=`<div class="person">${S.user.photoURL?`<img src="${esc(S.user.photoURL)}" alt="">`:`<div class="av" style="background:var(--accent)">${esc(initials(dispName()))}</div>`}<div class="t"><b>${esc(dispName())}</b><span>Login ID: ${esc(loginIdOf(S.user))}</span></div></div>

    inp.oninput=()=>{go.disabled=inp.value.trim().toLowerCase()!==(S.mess.name||"").trim().toLowerCase()};
    go.onclick=deleteMess;
  }
  const lv=$("#leaveMess");if(lv)lv.onclick=()=>armConfirm(lv,"Tap again to leave",async()=>{leaving=true;try{await peopleCol(S.messId).doc(S.user.uid).delete()}catch(e){leaving=false;toast(failMsg(e))}});
  if(ids.length){
    const rows=await Promise.all(ids.map(async id=>{try{const d=await fs.collection("directory").doc(id).get();return d.exists?{id,name:d.data().name}:null}catch(e){return null}}));
    const om=$("#otherMesses");if(!om)return;
    om.innerHTML=rows.filter(Boolean).map(r=>`<div class="person"><div class="av" style="background:${colorAt(r.name.length)}">${esc(initials(r.name))}</div><div class="t"><b>${esc(r.name)}</b><span>Your other mess</span></div><button class="btn sm" data-sw="${r.id}">Open</button></div>`).join("");
    om.querySelectorAll("[data-sw]").forEach(b=>b.onclick=async()=>{if(await isMemberOf(b.dataset.sw))openMess(b.dataset.sw);else{toast("You're no longer in that mess");userRef(S.user.uid).set({messIds:FV.arrayRemove(b.dataset.sw)},{merge:true});S.profile.messIds=S.profile.messIds.filter(x=>x!==b.dataset.sw);drawAccount()}});
  }
}

async function deleteMess(){
  const go=$("#delGo");go.disabled=true;go.textContent="Deleting…";
  const id=S.messId,code=S.mess.inviteCode,uid=S.user.uid;
  const others=Object.keys(S.people).filter(u=>u!==uid);
  stopAll();                                             // stop listening before removing everything
  try{
    // 1. purchases (in batches of 400)
    for(;;){const snap=await purCol(id).limit(400).get();if(!snap.docs.length)break;
      const b=fs.batch();snap.docs.forEach(d=>b.delete(d.ref));await b.commit();}
    // 2. the mess, its public name and its invite link
    await messRef(id).delete();
    await fs.collection("directory").doc(id).delete().catch(()=>{});
    if(code)await fs.collection("invites").doc(code).delete().catch(()=>{});
    // 3. members, then the head
    for(const u of others)await peopleCol(id).doc(u).delete().catch(()=>{});
    await peopleCol(id).doc(uid).delete().catch(()=>{});
    await userRef(uid).set({current:FV.delete(),messIds:FV.arrayRemove(id)},{merge:true}).catch(()=>{});
    S.profile.current=null;S.profile.messIds=(S.profile.messIds||[]).filter(x=>x!==id);
    S.messId=null;S.mess=null;S.people={};S.purchases=[];S.inSettings=false;
    S.screen="onboard";S.ob="choose";render();toast("Mess deleted");
  }catch(e){toast(failMsg(e));openMess(id)}
}

function fileBase(){return ((S.mess&&S.mess.name)||"mess").replace(/[^\w]+/g,"-").toLowerCase()+"-"+mk(S.view.y,S.view.m)}
function save(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();}
  catch(e){toast("Download isn't available here")}
}
function dlPDF(){

  const M=S.mess||{};const D=monthData();const doc=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
  const W=doc.internal.pageSize.getWidth();let y=56;const L=48,R=W-48;

  const line=()=>{doc.setDrawColor(210);doc.line(L,y,R,y);y+=16};const check=()=>{if(y>780){doc.addPage();y=56}};
  if(M.logo){try{doc.addImage(M.logo,M.logo.includes("image/png")?"PNG":"JPEG",L,y-24,40,40)}catch(e){}}
  const x0=M.logo?L+52:L;

  doc.setFont("helvetica","normal");doc.setFontSize(11);doc.setTextColor(100);doc.text("Monthly report, "+month,x0,y+16);doc.setTextColor(0);y+=46;
  doc.setFontSize(12);doc.text("Total spent: "+fmtPlain(D.total),L,y);doc.text("Per head: "+fmtPlain(D.share),L+200,y);doc.text("Purchases: "+D.list.length,L+360,y);y+=22;line();
  doc.setFont("helvetica","bold");doc.text("Settle up",L,y);y+=18;doc.setFont("helvetica","normal");
  if(!D.tx.length){doc.text("Everyone is even.",L,y);y+=18}
  D.tx.forEach(t=>{check();doc.text(`${t.from.name} pays ${t.to.name}`,L,y);doc.text(fmtPlain(t.amt),R,y,{align:"right"});y+=18});
  y+=6;line();
  doc.setFont("helvetica","bold");doc.text("Member balances",L,y);y+=18;
  doc.setFontSize(10);doc.setTextColor(110);doc.text("Member",L,y);doc.text("Paid",L+240,y,{align:"right"});doc.text("Share",L+340,y,{align:"right"});doc.text("Balance",R,y,{align:"right"});y+=16;
  doc.setTextColor(0);doc.setFont("helvetica","normal");doc.setFontSize(11);
  D.bal.forEach(b=>{check();doc.text(b.m.name,L,y);doc.text(fmtPlain(b.paid),L+240,y,{align:"right"});doc.text(fmtPlain(D.share),L+340,y,{align:"right"});
    const v=r2(b.bal);doc.text((v>0?"+":v<0?"-":"")+fmtPlain(Math.abs(v)),R,y,{align:"right"});y+=18});
  y+=6;line();
  doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text("Purchases",L,y);y+=18;
  doc.setFontSize(10);doc.setTextColor(110);doc.text("Date",L,y);doc.text("Item",L+80,y);doc.text("Paid by",L+300,y);doc.text("Amount",R,y,{align:"right"});y+=16;
  doc.setTextColor(0);doc.setFont("helvetica","normal");doc.setFontSize(11);
  [...D.list].sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{check();
    doc.text(p.date.split("-").reverse().join("/"),L,y);doc.text(doc.splitTextToSize(p.item,210)[0],L+80,y);doc.text((member(p.payer)||{}).name||"-",L+300,y);doc.text(fmtPlain(p.amount),R,y,{align:"right"});y+=18});
  save(fileBase()+".pdf",doc.output("blob"));
}

render();
})();
